name: Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.0'

      - name: Build backend
        run: go build -v -ldflags="-s -w" -o mcp-gateway .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd web
          npm ci

      - name: Build frontend
        run: |
          cd web
          npm run build

      - name: Install semantic-release dependencies
        run: |
          npm install -g \
            semantic-release@23 \
            @semantic-release/github@10 \
            conventional-changelog-conventionalcommits@7

      - name: Create release package
        run: |
          mkdir -p release
          cp mcp-gateway release/
          cp -r web/dist release/web-dist
          cp -r conf release/
          tar -czf mcp-gateway-linux-amd64.tar.gz -C release .

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
