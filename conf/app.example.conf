# MCP Gateway - Example Configuration
# Copy this file to app.conf and update with your actual values

appname = mcp-gateway
httpport = 8080
runmode = dev
autorender = false
copyrequestbody = true
EnableDocs = true

# Session Configuration
sessionon = true
sessionprovider = memory
sessionname = mcp_session
sessiongcmaxlifetime = 3600

# MCP Upstream Server Configuration
mcp.upstream_url = http://localhost:3000

# OAuth2 Configuration
# Replace with your actual OAuth provider credentials
oauth2.client_id = YOUR_CLIENT_ID_HERE
oauth2.client_secret = YOUR_CLIENT_SECRET_HERE
oauth2.redirect_url = http://localhost:8080/oauth/callback

# Google OAuth Configuration
oauth2.auth_url = https://accounts.google.com/o/oauth2/auth
oauth2.token_url = https://accounts.google.com/o/oauth2/token

# GitHub OAuth Configuration (uncomment to use)
# oauth2.auth_url = https://github.com/login/oauth/authorize
# oauth2.token_url = https://github.com/login/oauth/access_token

# Microsoft Azure AD OAuth Configuration (uncomment to use)
# oauth2.auth_url = https://login.microsoftonline.com/common/oauth2/v2.0/authorize
# oauth2.token_url = https://login.microsoftonline.com/common/oauth2/v2.0/token

# Casbin Configuration
casbin.model = conf/casbin_model.conf
casbin.policy = conf/casbin_policy.csv

# Logging Configuration
log.level = debug
log.outputs = console

# For production use:
# runmode = prod
# log.outputs = file
# log.file = logs/mcp-gateway.log
# log.level = info
